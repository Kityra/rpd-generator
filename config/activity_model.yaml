# Правила модуля «Модель деятельности профессии». Все пороги алгоритма лежат здесь, в коде их нет.
# Изменение файла меняет config_hash версии модели, поэтому старые версии остаются воспроизводимыми.

# Окно, за которое считаются вакансии и другие источники, в месяцах. Предыдущее окно той же длины
# (непосредственно перед текущим) служит «прошлым снимком» для динамики рынка.
window_months: 12
# Если работодателей с вакансиями меньше, доля рынка не считается («мало данных», а не 0).
min_employers: 10

experts:
  # Минимум голосов надёжных экспертов (без «не знаю») для любого экспертного статуса.
  n_min: 10
  # Если для решения нужно больше экспертов, задача «спорна по существу»: людьми это не решить.
  n_max: 60
  # Квантиль нормального распределения для 95 % доверительного интервала Вильсона.
  z: 1.96
  # Порог большинства: задача подтверждена, если нижняя граница интервала выше этой доли.
  majority: 0.5
  # Сколько карточек получает один эксперт (15–25 минут на анкету).
  max_cards_per_expert: 40
  # Доля контрольных карточек («ловушек») в анкете.
  control_share: 0.10
  exclude:
    # Ошибся в такой доле «чужих» карточек (ответил «да» на задачу другой профессии) — исключён.
    foreign_errors_share: 0.34
    # Ответил по-разному на такую долю дублей (перефразировок одной задачи) — исключён.
    duplicate_mismatch_share: 0.5
    # Медианное время на карточку меньше стольких секунд — исключён (не читал карточки).
    median_seconds_per_card: 2
    # Такая доля одинаковых ответов — исключён (нажимал одну кнопку).
    same_answer_share: 0.9
    # Правило одинаковых ответов проверяется, только если эксперт ответил хотя бы на столько карточек.
    min_cards_for_pattern: 10
  # Минимум голосов в каждом сегменте, чтобы сравнивать сегменты.
  segment_min_n: 5
  # Разница долей согласия между сегментами, при которой ставится флаг расслоения.
  segment_gap: 0.3
  # Сегменты экспертов, по которым ищется расслоение.
  segment_fields: [company_size, role_kind]
  # Метод Дельфи: опрос останавливается, если в раунде изменилось меньше такой доли ответов.
  delphi_stable_share: 0.10
  # Сколько раундов Дельфи проводится максимум.
  delphi_max_rounds: 2

trend:
  # Прогноз экспертов «станет важнее минус станет менее важной» не меньше этого — «растёт», не больше минус этого — «снижается».
  forecast_threshold: 0.3
  # Доля ответов «в основном будет автоматизирована», начиная с которой задача «автоматизируется».
  automated_min: 0.4
  # «Новая»: в прошлом снимке доля работодателей была ниже этой...
  new_prev_max_share: 0.02
  # ...а сейчас не ниже этой.
  new_now_min_share: 0.05
  # «Исчезает»: снижается и сейчас доля работодателей ниже этой.
  disappearing_max_share: 0.05
  # Поправка к приоритету по тренду. Для «автоматизируется» и «неоднозначно» поправка — допущение,
  # спецификация её не задаёт (см. ACTIVITY_MODEL.md).
  bonus:
    new: 1
    growing: 1
    stable: 0
    no_data: 0
    ambiguous: 0
    declining: -1
    automated: -1
    disappearing: -2

importance:
  # Если голосов экспертов нет, важность (1–5) оценивается по доле работодателей.
  from_market:
    - {min_share: 0.3, importance: 4}
    - {min_share: 0.1, importance: 3}
  # Важность, если доля ниже всех порогов выше.
  market_default: 2
  # Важность, если нет ни голосов, ни достаточного числа вакансий.
  no_data_default: 2

# Слияние формулировок по сходству эмбеддингов. В этой версии эмбеддингов нет, пороги зарезервированы (см. ACTIVITY_MODEL.md).
merge:
  auto: 0.88
  review: 0.75

# Сопоставление задачи с функцией и поиск кандидатов в дубли по словам (сходство Жаккара по понятиям).
# Эмбеддингов в MVP нет, поэтому пороги отдельные и ниже, чем у merge.
grouping:
  # Не ниже — задача относится к функции автоматически.
  auto: 0.5
  # От review до auto — задача остаётся в «Прочем» и попадает в очередь методиста с подсказкой функции.
  review: 0.25
  # Кандидаты в дубли задач для очереди методиста (не сливаются автоматически).
  duplicate_review: 0.6

canonical:
  # Длина основы глагола в canonical_key: «Разрабатывает» и «Разработка» → «разра».
  verb_prefix_len: 5

# Вклад одного типа источника в подкреплённость задачи (support). Внутри типа берётся лучший источник.
# Множители свежести по возрасту — coverage.freshness в config/analysis.yaml.
source_weights: {standard: 0.8, vacancy: 0.8, rpd: 0.5, science: 0.7, employer_doc: 0.8, forecast: 0.6, expert: 1.0}

# Правила рекомендаций руководителю программы R1–R7 (раздел 7.11).
recommendations:
  # R1: доля Σ priority непокрытой функции от профессии, начиная с которой предлагается новая дисциплина.
  new_discipline_min_share: 0.08
  # R1: пул ЗЕТ вариативной части для оценки объёма новой дисциплины.
  elective_zet_pool: 60
  zet_min: 2
  zet_max: 6
  # R3: доля содержания на отклонённые, исчезающие, непроверенные задачи или темы без связи — «сократить»...
  reduce_share: 0.3
  # ...а начиная с этой — «убрать или переработать».
  remove_share: 0.6
  # R4: сходство Жаккара по покрытым пунктам двух дисциплин — «объединить».
  merge_similarity: 0.6
  # R5: столько подтверждённых задач на фундаментальную область знаний защищают дисциплину.
  fundamental_min_tasks: 3

profile_signal:
  # A: изменение числа работодателей за год, при котором рынок считается падающим.
  a_risk: -0.2
  # B: доля Σ priority задач со снижением, исчезновением или автоматизацией — «трансформируется».
  b_transform: 0.3
  # B: то же — условие «под риском».
  b_risk: 0.4
  # C: прогноз экспертов по спросу на роль (доля «вырастет» минус «снизится») — условие «под риском».
  c_risk: -0.3
  # Доля экспертов, назвавших одну роль-преемника, — «трансформируется».
  successor_min_share: 0.3

# Извлечение утверждений из текстов источников.
extraction:
  # Цитата короче этого (после нормализации) не считается доказательством.
  min_quote_chars: 8
  # Длина цитаты, которую разрешено вернуть экстрактору.
  max_quote_chars: 300
  # Длинный текст делится на части такого размера (символов) — по одному вызову модели на часть.
  chunk_chars: 5000

# Сопоставление дисциплин программы с задачами модели (раздел 7.10).
coverage:
  # Задача найдена в тексте темы (результата, задания), если в нём есть такая доля понятий задачи без глагола.
  match_share: 0.6

# Контрольные карточки («ловушки»): задачи далёких профессий. Правильный ответ эксперта — «Нет, это другая роль».
# Система берёт из списка те, у которых нет общих понятий с задачами профессии.
controls:
  foreign_tasks:
    - Проектирует систему капельного полива грядок
    - Составляет меню банкета и рассчитывает закупку продуктов
    - Проводит предполётный осмотр шасси самолёта
    - Подбирает породу дерева для паркетной доски
    - Принимает роды у крупного рогатого скота
  # Сколько «чужих» карточек минимум добавляется в анкету.
  min_foreign: 2

# Сигнал по профилю: смежная профессия считается «сохраняющей» задачу, если у неё есть задача
# с тем же ключом или сходством понятий не ниже этого порога.
adjacent:
  task_similarity: 0.6
  # Роль-преемник, названная экспертами, сопоставляется с профессией в базе при таком сходстве названий.
  name_similarity: 0.5
