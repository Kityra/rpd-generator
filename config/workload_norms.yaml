# Внутренние настройки расчёта учебной нагрузки rpd-generator.
# Это НЕ нормы образовательных стандартов: значения подобраны как разумные ориентиры
# и должны сверяться с учебным планом вуза. Измените их под свою программу.
# Часы считает только код (domain/workload.py); модель не задаёт числа.

defaults:
  program_type: bachelor
  hours_per_credit: 36
  semesters: 2
  assessment_form: exam

# Объём курса по умолчанию, если преподаватель не указал его при создании курса.
program_types:
  bachelor:
    label: Бакалавриат
    total_credits: 60
  specialist:
    label: Специалитет
    total_credits: 60
  master:
    label: Магистратура
    total_credits: 60
  postgraduate:
    label: Аспирантура
    total_credits: 60
  dpo:
    label: ДПО (повышение квалификации, переподготовка)
    total_credits: 16
  other:
    label: Другая программа
    total_credits: 30

# Формы промежуточной аттестации: подпись для РПД и часы на аттестацию в дисциплине.
assessment_forms:
  exam:
    label: экзамен
    hours: 36
  graded_credit:
    label: зачет с оценкой
    hours: 6
  credit:
    label: зачет
    hours: 4

# Доли видов работ в часах дисциплины без аттестации.
# Характер дисциплины определяет код по заданиям:
#   theoretical — нет практических заданий,
#   practical   — есть практические задания,
#   laboratory  — есть задания лабораторного типа (см. markers.laboratory).
# Лабораторные часы появляются только у дисциплин с характером laboratory.
shares:
  bachelor:
    theoretical: {lectures: 0.30, practice: 0.20, labs: 0.00, independent: 0.50}
    practical:   {lectures: 0.25, practice: 0.30, labs: 0.00, independent: 0.45}
    laboratory:  {lectures: 0.20, practice: 0.15, labs: 0.25, independent: 0.40}
  specialist:
    theoretical: {lectures: 0.30, practice: 0.20, labs: 0.00, independent: 0.50}
    practical:   {lectures: 0.25, practice: 0.30, labs: 0.00, independent: 0.45}
    laboratory:  {lectures: 0.20, practice: 0.15, labs: 0.25, independent: 0.40}
  master:
    theoretical: {lectures: 0.20, practice: 0.20, labs: 0.00, independent: 0.60}
    practical:   {lectures: 0.15, practice: 0.30, labs: 0.00, independent: 0.55}
    laboratory:  {lectures: 0.12, practice: 0.18, labs: 0.20, independent: 0.50}
  postgraduate:
    theoretical: {lectures: 0.15, practice: 0.15, labs: 0.00, independent: 0.70}
    practical:   {lectures: 0.10, practice: 0.25, labs: 0.00, independent: 0.65}
    laboratory:  {lectures: 0.10, practice: 0.15, labs: 0.15, independent: 0.60}
  dpo:
    theoretical: {lectures: 0.45, practice: 0.25, labs: 0.00, independent: 0.30}
    practical:   {lectures: 0.30, practice: 0.45, labs: 0.00, independent: 0.25}
    laboratory:  {lectures: 0.25, practice: 0.30, labs: 0.25, independent: 0.20}
  other:
    theoretical: {lectures: 0.30, practice: 0.20, labs: 0.00, independent: 0.50}
    practical:   {lectures: 0.25, practice: 0.30, labs: 0.00, independent: 0.45}
    laboratory:  {lectures: 0.20, practice: 0.15, labs: 0.25, independent: 0.40}

# Вес дисциплины при делении объёма курса:
#   (base + per_topic × темы + per_practical_assignment × практические задания)
#   × fundamental (для фундаментального ядра) × importance[ранг модели]
weights:
  base: 1.0
  per_topic: 1.0
  per_practical_assignment: 0.5
  fundamental: 1.5

# Относительная важность дисциплины — единственное, что может предложить модель (фиксированный набор).
importance:
  core: 1.5
  major: 1.2
  standard: 1.0
  minor: 0.8

# Признаки заданий (подстроки в тексте задания, без учёта регистра).
markers:
  practical: [разработ, реализ, напиш, состав, построй, рассчит, расчёт, расчет, спроектир, настрой,
              выполн, проанализир, подготов, оформ, запрос, код, скрипт, модел, прототип, отчёт, отчет, проект]
  laboratory: [лаборатор, эксперимент, стенд, измерен, установк, опыт, датасет, набор данных, обучите модель,
               обучить модель, тестовом окружении, запустите, код, скрипт, программ]
