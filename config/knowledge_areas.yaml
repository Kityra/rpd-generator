# Межпрофессиональные области знаний. Знание, умение или инструмент относится к области, если в его
# названии встречается каноническое имя или синоним (сравнение по основам слов).
# kind: fundamental — фундаментальная область (защищает дисциплину от сокращения, правило R5);
#       applied — прикладная.
