# Внутренние настройки проверки смысла и качества источников rpd-generator (не нормы стандартов).

# Группы равнозначных терминов (русский и английский, сокращения). Используются при сравнении
# названия дисциплины с цитатой, при поиске дублей и связи дисциплины с профессией.
# Первый элемент — каноническое имя понятия.
synonyms:
  - [искусственный интеллект, ии, ai, artificial intelligence]
  - [слабый, узкий, weak, narrow]
  - [сильный, общий, strong, general, agi]
  - [машинное обучение, machine learning, ml]
  - [глубокое обучение, deep learning]
  - [нейронная сеть, нейросеть, neural network]
  - [обучение с подкреплением, reinforcement learning, rl]
  - [база данных, бд, database, databases, sql]
  - [данные, data]
  - [анализ, аналитика, analysis, analytics]
  - [статистика, statistics, статистический]
  - [регрессия, regression]
  - [классификация, classification]
  - [визуализация, visualization, visualisation]
  - [программирование, programming, разработка программ]
  - [python, питон]
  - [языковая модель, llm, large language model, большая языковая модель]
  - [промпт, prompt, запрос к модели]
  - [облачные вычисления, cloud computing, облако]
  - [безопасность, security, информационная безопасность]
  - [тестирование, testing, qa]
  - [управление проектами, project management]

# Слова, которые не задают предмет дисциплины.
generic_terms: [теория, теории, основы, основа, введение, курс, дисциплина, практикум, методы, метод, современные,
                общие, вопросы, часть, раздел, модуль, специальные, избранные, главы, принципы, технологии,
                theory, introduction, basics, fundamentals, course, methods]

rationale:
  # Доля понятий названия дисциплины, которая должна встретиться в цитате.
  # Для названий из 1–3 понятий нужны все понятия, для более длинных — эта доля.
  min_title_coverage: 0.67
  # Минимум общих понятий между объяснением и цитатой.
  min_explanation_overlap: 1

composition:
  # Дисциплины считаются почти-дублями при такой доле общих понятий (Жаккар).
  duplicate_similarity: 0.75
  # Наибольшая доля дисциплин с флагом «фундаментальное ядро».
  max_fundamental_share: 0.4
  # Флаг «фундаментальное ядро» подтверждают только источники этих типов.
  fundamental_source_types: [RPD, Books]

coverage:
  # Вклад источника в подтверждение задачи. Сумма вкладов независимых источников делится на required_weight.
  required_weight: 1.0
  source_weights:
    Priklad: 1.0
    expert: 1.0
    HH: 0.8
    Rostrud: 0.8
    EmployerCareer: 0.8
    RabotaRu: 0.8
    documentation: 0.7
    Crossref: 1.0
    arXiv: 0.7
    Books: 0.6
    RPD: 0.5
  # Множитель свежести по году публикации (если год найден в тексте источника).
  freshness:
    - {max_age_years: 2, factor: 1.0}
    - {max_age_years: 5, factor: 0.7}
    - {max_age_years: 100, factor: 0.4}
