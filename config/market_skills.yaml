# Словарь навыков и пороги анализа рынка rpd-generator (внутренние настройки, не нормы стандартов).
# Навык распознаётся в тексте вакансии или программы по любому из названий (без учёта регистра и словоформ).
# Расширяйте словарь под свою отрасль: первый элемент — каноническое название навыка.

thresholds:
  # Навык критичный, если встречается не менее чем в этой доле вакансий выборки; остальные — дополнительные.
  critical_share: 0.3
  # При меньшей выборке доли не считаются надёжными: отчёт предупреждает об этом.
  min_sample: 5
  # Если в данных есть только веса навыков (без вакансий), критичны навыки с весом не ниже этой доли от максимального.
  critical_weight: 0.5
  # Вклад частичного покрытия (навык есть только в заданиях или стеке задач, но не в темах) в итоговую оценку.
  partial_credit: 0.5

