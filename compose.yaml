x-runtime: &runtime
  build: .
  env_file: .env
  environment:
    APP_DATABASE_URL: postgresql://rpd:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/rpd
    CHECKPOINT_URL: ""
  volumes:
    - course-data:/app/data

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rpd
      POSTGRES_USER: rpd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpd -d rpd"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    <<: *runtime
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]
    healthcheck:
      disable: true
  app:
    <<: *runtime
    depends_on: &migrated
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped
  worker:
    <<: *runtime
    depends_on: *migrated
    command: ["python", "-m", "workers.course_worker"]
    healthcheck:
      disable: true
    restart: unless-stopped
  scheduler:
    <<: *runtime
    depends_on: *migrated
    command: ["python", "-m", "workers.relevance_scheduler"]
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  course-data:
  postgres-data:
