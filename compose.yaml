x-runtime: &runtime
  image: ${RPD_IMAGE:-rpd-generator:local}
  build: .
  env_file: ${RPD_ENV_FILE:-.env}
  environment:
    APP_DATABASE_URL: postgresql://rpd:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/rpd
    CHECKPOINT_URL: ""
  volumes:
    - course-data:/app/data
  logging: &rotated-logs
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rpd
      POSTGRES_USER: rpd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "rpd", "-d", "rpd"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    logging: *rotated-logs
  migrate:
    <<: *runtime
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]
    healthcheck:
      disable: true
  app:
    <<: *runtime
    depends_on: &migrated
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${RPD_WEB_PORT:-8501}:8501"
    restart: unless-stopped
  worker:
    <<: *runtime
    depends_on: *migrated
    command: ["python", "-m", "workers.course_worker"]
    healthcheck:
      disable: true
    restart: unless-stopped
  scheduler:
    <<: *runtime
    depends_on: *migrated
    command: ["python", "-m", "workers.relevance_scheduler"]
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  course-data:
  postgres-data:
